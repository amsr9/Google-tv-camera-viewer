name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk home-cameras.apk

      - uses: actions/upload-artifact@v4
        with:
          name: home-cameras-apk
          path: home-cameras.apk

      # Publishes the APK at a fixed link the TV can download directly:
      # https://github.com/<you>/<repo>/releases/latest/download/home-cameras.apk
      # (works without signing in only if the repository is public)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Home Cameras build ${{ github.run_number }}
          files: home-cameras.apk
          make_latest: true
